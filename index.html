<title>အဘိဓမ္မာ လေ့ကျင့်ခန်း</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap">
<style>

:root[data-theme="dark"]{
  --bg:#100F24; --sf:#1B1940; --ink:#EFECFB; --mu:#ADA9D6; --ln:#312E66; 
  --gold:#F5BE1D; --gt:#241900; --ac:#9391F2; --act:#13123A; --tint:#25224D;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Myanmar","Padauk","Myanmar Text",sans-serif;line-height:1.85;font-size:16px}

.chip i{font-style:normal;color:var(--mu);font-size:12px;margin-left:5px}

.box h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:8px;flex:none;box-shadow:0 0 6px var(--gold)}
.nm{font-size:22px;font-weight:700;margin:4px 0 2px;line-height:1.6}
.sub{color:var(--mu);font-size:14px}
.note{font-size:13px;color:var(--mu);margin-top:6px;line-height:1.7}

.fm:focus{border-color:var(--ac)}

.th img{display:block;width:100%;max-height:320px;object-fit:cover}
.lk{display:block;color:var(--ac);font-weight:600;text-decoration:none;word-break:break-all}
.lk small{display:block;color:var(--mu);font-weight:400;font-size:13px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
textarea.fm{min-height:120px;resize:vertical;line-height:1.7}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
html { font-size: 18px; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans Myanmar", "Padauk", "Myanmar Text", sans-serif; line-height: 1.85; }
body { max-width: 600px; margin: 0 auto; padding: 12px 14px 48px; font-size: 1rem; }
header h1 { font-size: 1.375rem; margin: 0; font-weight: 700; line-height: 1.5; color: #fff; }
header p { margin: 4px 0 0; font-size: 0.8125rem; color: #D8D4F7; line-height: 1.6; }
.seg button { font-size: 0.8125rem; }
.it small { font-size: 0.8125rem; }
.chip { font-size: 0.8125rem; }
.chip i { font-size: 0.75rem; }
.back { font-size: 0.875rem; }
.box h3 { font-size: 0.875rem; }
.nm { font-size: 1.375rem; font-weight: 700; margin: 4px 0 2px; line-height: 1.6; }
.sub { color: var(--mu); font-size: 0.875rem; }
.note { font-size: 0.8125rem; color: var(--mu); margin-top: 6px; line-height: 1.7; }
</style>

function mSaveLink(){

  if(EXAM.pool.length && EXAM.pos<EXAM.pool.length){
    const q=EXAM.pool[EXAM.pos];
    h+=`<div class="box"><div class="row2"><span class="sub">${EXAM.review?"မှားခဲ့သော မေးခွန်းများ":"လေ့ကျင့်ခန်း"} · ${EXAM.pos+1}/${EXAM.pool.length}</span><b>အမှတ် ${EXAM.score}/${EXAM.answered}</b></div><div class="nm" style="font-size:17px;margin:12px 0">${q.q}</div>${q._opts.map(o=>`<button class="it" data-eopt="${encodeURIComponent(o)}" ${EXAM.show?"disabled":""} style="${EXAM.show&&o==q.a?"border-left-color:#1F7A5C":EXAM.show&&o==EXAM.chosen?"border-left-color:#B3342B":""}">${EXAM.show&&o==q.a?"✓ ":""}${EXAM.show&&o==EXAM.chosen&&o!=q.a?"✗ ":""}${o}</button>`).join("")}`;
    if(EXAM.show)h+=`<div class="note">${EXAM.chosen==q.a?"မှန်ကန်ပါတယ်။":"အဖြေမှန် — "+q.a}</div><button class="chip on" data-enext="1" style="margin-top:10px">${EXAM.pos+1==EXAM.pool.length?"ရလဒ်ကြည့်မည်":"နောက်မေးခွန်း"}</button>`;
    h+=`</div>`;
  } else if(EXAM.pool.length && EXAM.pos>=EXAM.pool.length){
    h+=`<div class="box"><div class="nm">လေ့ကျင့်မှု ပြီးပါပြီ</div><div class="nm" style="font-size:24px">${EXAM.score} / ${EXAM.answered} မှတ်</div><div class="sub">မှန်ကန်မှု ${EXAM.answered?Math.round(EXAM.score/EXAM.answered*100):0}%</div><button class="chip on" data-estart="1">ထပ်မံလေ့ကျင့်မည်</button></div>`;
  } else if(EXAM.review){
    h+=`<div class="box">ဒီခေါင်းစဉ်မှာ ပြန်လေ့ကျင့်ရန် မှားထားသော မေးခွန်း မရှိသေးပါ။</div>`;
  }
  return h;
}

function render(){
  const s=st[st.length-1];let h="";
  if(!s){
    h=sysBar()+`<div class="seg"><button data-t="list" aria-pressed="${tab=="list"}">စိတ်စာရင်း</button><button data-t="flt" aria-pressed="${tab=="flt"}">အချက်ဖြင့် ရှာရန်</button><button data-t="vithi" aria-pressed="${tab=="vithi"}">ဝီထိ</button><button data-t="rupa" aria-pressed="${tab=="rupa"}">ရုပ် ၂၈</button><button data-t="gl" aria-pressed="${tab=="gl"}">အဓိပ္ပါယ်</button><button data-t="study" aria-pressed="${tab=="study"}">ကျက်ရန်</button><button data-t="exam" aria-pressed="${tab=="exam"}">မေးခွန်း</button><button data-t="mine" aria-pressed="${tab=="mine"}">ကိုယ်ပိုင်</button></div>`;
    if(tab=="gl"){h+=glHome()}else if(tab=="mine"){h+=mineHome()}else if(tab=="study"){h+=studyHome()}else if(tab=="exam"){h+=examHome()}else if(tab=="vithi"){h+=vithiHome()}else if(tab=="rupa"){h+=rupaHome()}else if(tab=="list"){const seen=[];T.forEach(c=>{if(vis(c)&&!seen.includes(c.g))seen.push(c.g)});
      h+=seen.map(g=>`<details><summary>${g}</summary>${T.map((c,i)=>c.g==g&&vis(c)?itm(i):"").join("")}</details>`).join("")}
    else{
      h+=`<div class="chips">${AT.map(a=>`<button class="chip ${a==fa?"on":""}" data-a="${a}">${a}</button>`).join("")}</div><div class="box" style="margin-top:10px"><div class="chips">`;
      const m={};T.filter(vis).forEach(c=>attr(c,fa).forEach(v=>m[v]=(m[v]||0)+1));
      h+=Object.keys(m).map(v=>`<button class="chip" data-f="${fa}" data-v="${v}">${v}<i>${m[v]}</i></button>`).join("")+`</div></div>`;
    }
  }else if(s.g!==undefined){h=glView(s.g)}else if(s.mv!==undefined){h=mineView(s.mv)}else if(s.r!==undefined){h=rupaDetail(s.r)}else if(s.rf){h=rupaList(s.rf,s.v)}else if(s.f){
    const L=T.map((c,i)=>i).filter(i=>vis(T[i])&&attr(T[i],s.f).includes(s.v));
    h=`<button class="back" data-b>‹ နောက်သို့</button><div class="nm">${s.f} - ${s.v}</div>${glBox(s.v)}<div class="sub">စိတ် ${L.length} ပါး</div>`+L.map(itm).join("");
  }else{
    const c=T[s.i];
    const row=(l,t)=>`<div class="box"><h3>${t||l}</h3><div class="chips">${attr(c,l).map(v=>chip(l,v)).join("")}</div></div>`;
    h=`<button class="back" data-b>‹ နောက်သို့</button><div class="nm">${dn(c)}</div><div class="sub">${ds(c)}</div>
    <div class="chips" style="margin-top:8px">${chip("ဘူမိ",c.pl)}${chip("ဇာတိ",c.j)}${chip("ဇော",c.jv?"ဇောစိတ်":"ဇောမဟုတ်")}</div>
    ${row("ဝေဒနာ")}${row("ဟေတု","ဟေတု "+c.hetu.length+" ပါး")}${row("ဒွါရ")}${row("ဝတ္ထု")}${vNote(c)}${row("ကိစ္စ")}
    <div class="box"><h3>အာရုံ</h3><div class="chips">${c.ar.map(v=>chip("အာရုံ",v)).join("")}</div><div class="note">${c.an}</div></div>
    <div class="box"><h3>ယှဉ်သော စေတသိက် ${cnt(c)} ပါး</h3>
    ${c.ce.map(g=>`<div class="note" style="margin-top:8px">${g[0]} ${g[1].length}</div><div class="chips">${g[1].map(v=>chip("စေတသိက်",v.replace("*","")).replace(">"+v.replace("*","")+"<",">"+v+"<")).join("")}</div>`).join("")}
    ${JSON.stringify(c.ce).includes("*")?`<div class="note" style="margin-top:8px">* ပါသော စေတသိက်သည် တစ်ခါတစ်ရံသာ ယှဉ်သော်လည်း အရေအတွက်ထဲ ပါဝင်သည်။</div>`:""}</div>`;
  }
  $("app").innerHTML=h;scrollTo(0,0);
}
$("app").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){tab=b.dataset.t;render()}
  else if(b.dataset.et){EXAM.topic=b.dataset.et;EXAM.pool=[];EXAM.pos=0;EXAM.show=false;render()}
  else if(b.dataset.estart){examStart(false);render()}
  else if(b.dataset.ereview){examStart(true);render()}
  else if(b.dataset.eopt!==undefined){
    if(!EXAM.show && EXAM.pool[EXAM.pos]){
      const q=EXAM.pool[EXAM.pos], chosen=decodeURIComponent(b.dataset.eopt);
      EXAM.chosen=chosen;EXAM.show=true;EXAM.answered++;
      if(chosen===q.a){EXAM.score++;EXAM_WRONG=EXAM_WRONG.filter(x=>!(x.t===q.t&&x.q===q.q));examSaveWrong()}
      else if(!EXAM_WRONG.some(x=>x.t===q.t&&x.q===q.q)){EXAM_WRONG.push(q);examSaveWrong()}
      else {EXAM_WRONG=EXAM_WRONG.filter(x=>!(x.t===q.t&&x.q===q.q));EXAM_WRONG.push(q);examSaveWrong()}
      render();
    }
  }
  else if(b.dataset.enext){EXAM.pos++;EXAM.show=false;EXAM.chosen=null;render()}
  else if(b.dataset.a){fa=b.dataset.a;render()}
  else if(b.dataset.i!==undefined){st.push({i:+b.dataset.i});render()}
  else if(b.dataset.gi!==undefined){st.push({g:+b.dataset.gi});render()}
  else if(b.dataset.mc){MF=b.dataset.mc;render()}
  else if(b.dataset.mi!==undefined){$("mfile").click()}
  else if(b.dataset.ml!==undefined){mSaveLink()}
  else if(b.dataset.md){if(MD==b.dataset.md){mDel(b.dataset.md);MD=null}else MD=b.dataset.md;render()}
  else if(b.dataset.mv){st.push({mv:b.dataset.mv});render()}
  else if(b.dataset.mz!==undefined){MZ=MZ%3+1;render()}
  else if(b.dataset.sys!==undefined){S121=b.dataset.sys=="1";try{localStorage.setItem("sys121",S121?"1":"0")}catch(e){}ST.q=null;render()}
  else if(b.dataset.rs){Object.keys(PG).filter(k=>k.startsWith(ST.d+"|")).forEach(k=>delete PG[k]);pSave();render()}
  else if(b.dataset.sd){ST.d=b.dataset.sd;ST.q=null;ST.f=0;ST.s=0;ST.t=0;render()}
  else if(b.dataset.sm){ST.m=b.dataset.sm;ST.q=null;ST.f=0;render()}
  else if(b.dataset.sf){ST.f=1;render()}
  else if(b.dataset.sn){if(b.dataset.sn!="x"&&ST.q)rec(ST.q,b.dataset.sn=="1");if(b.dataset.sn=="1")ST.s++;if(b.dataset.sn!="x")ST.t++;ST.q=null;ST.f=0;render()}
  else if(b.dataset.so!==undefined){const q=ST.q;if(q&&q.g===undefined){q.g=+b.dataset.so;ST.t++;rec(q,q.o[q.g]==q.a);if(q.o[q.g]==q.a)ST.s++;render()}}
  else if(b.dataset.ri!==undefined){st.push({r:+b.dataset.ri});render()}
  else if(b.dataset.rf){st.push({rf:b.dataset.rf,v:b.dataset.v});render()}
  else if(b.dataset.f){st.push({f:b.dataset.f,v:b.dataset.v});render()}
  else if(b.dataset.b!==undefined){st.pop();render()}
  else if(b.dataset.fs){
    if(b.dataset.fs=="+" && FSize < 36) FSize += 2;
    if(b.dataset.fs=="-" && FSize > 12) FSize -= 2;
    document.documentElement.style.fontSize = FSize + "px";
    try{ localStorage.setItem("abhi-fs", FSize); }catch(e){}
    render();}
};
render();mLoad();
$("app").oninput=e=>{if(e.target.id=="gnote"&&GCUR!=null){GN[GCUR]=e.target.value;try{localStorage.setItem("abhi-gl-note",JSON.stringify(GN))}catch(x){}}};
$("app").onchange=async e=>{
  const t=e.target;if(t.id!="mfile"||!t.files[0])return;const f=t.files[0];
  try{const d=await readImg(f);mPut({id:Date.now(),t:Date.now(),type:"img",cat:$("mcat").value,title:($("mti").value||"").trim()||f.name.replace(/\.[^.]+$/,""),data:d});MM="သိမ်းပြီးပါပြီ"}catch(err){MM="ပုံကို ဖတ်၍ မရပါ"}
  render();
};
</script>
