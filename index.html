<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>အဘိဓမ္မာ လေ့ကျင့်ခန်း</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F4F2FC; --sf:#FFFFFF; --ink:#1F1D3F; --mu:#64608E; --ln:#E4DFF5;
  --gold:#D99A00; --gt:#2B1F00; --ac:#4A48BE; --act:#FFFFFF; --tint:#EFEBFA;
  --sh:0 2px 4px rgba(40,30,110,.04),0 6px 16px rgba(40,30,110,.06);
  --hd1:#2B2A6B; --hd2:#5043B0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100F24; --sf:#1B1940; --ink:#EFECFB; --mu:#ADA9D6; --ln:#312E66;
    --gold:#F5BE1D; --gt:#241900; --ac:#9391F2; --act:#13123A; --tint:#25224D;
    --sh:0 2px 6px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
    --hd1:#1A194D; --hd2:#2E2A78;
  }
}
:root[data-theme="dark"]{
  --bg:#100F24; --sf:#1B1940; --ink:#EFECFB; --mu:#ADA9D6; --ln:#312E66;
  --gold:#F5BE1D; --gt:#241900; --ac:#9391F2; --act:#13123A; --tint:#25224D;
  --sh:0 2px 6px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
  --hd1:#1A194D; --hd2:#2E2A78;
}
html{
  font-size:16px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
body{
  margin:0 auto;
  max-width:600px;
  padding:12px 14px 48px;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans Myanmar","Padauk","Myanmar Text",sans-serif;
  font-size:1rem;
  line-height:1.85;
}
header{
  margin:-12px -14px 16px;
  padding:22px 20px 20px;
  background:linear-gradient(135deg,var(--hd1),var(--hd2));
  color:#fff;
  border-radius:0 0 24px 24px;
  box-shadow:var(--sh);
}
header h1{
  margin:0;
  font-size:1.375rem;
  font-weight:700;
  line-height:1.5;
  color:#fff;
}
header p{
  margin:4px 0 0;
  font-size:0.8125rem;
  color:#D8D4F7;
  line-height:1.6;
}
button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;
}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.seg{
  display:flex;
  gap:6px;
  background:var(--tint);
  border-radius:14px;
  padding:5px;
  margin-bottom:16px;
  overflow-x:auto;
  scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1 0 auto;
  white-space:nowrap;
  border:0;
  background:transparent;
  padding:7px 12px;
  font-size:0.8125rem;
  line-height:1.5;
  border-radius:10px;
  color:var(--mu);
}
.seg button[aria-pressed="true"]{
  background:var(--ac);
  color:var(--act);
  font-weight:700;
  box-shadow:var(--sh);
  font-size: 0.875rem;
  line-height: 1.5;
}

.it{
  display:block;
  width:100%;
  text-align:left;
  border:2px solid var(--gold);
  font-size: 0.95rem;
  line-height: 1.75;
  background:var(--sf);
  border-radius:14px;
  padding:11px 14px;
  margin:8px 0;
  box-shadow:var(--sh);
}
.it:hover{
  border-color:var(--gold);
  box-shadow:0 0 10px rgba(245,190,29,.4);
}
.it b{font-weight:600}
.it small{
  display:block;
  color:var(--mu);
  font-size:0.85rem;
  line-height:1.65;
  margin-top:2px;
}

details{margin-bottom:10px}
summary{
  list-style:none;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
  padding:10px 8px;
  cursor:pointer;
  color:var(--ac);
  border-radius:10px;
  transition:background .15s;
}
summary:hover{background:var(--tint)}
summary::-webkit-details-marker{display:none}
summary::before{
  content:"\203A";
  display:inline-block;
  font-size:20px;
  line-height:1;
  transition:transform .2s ease;
}
details[open]>summary::before{transform:rotate(90deg)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--ln);
  background:var(--tint);
  border-radius:999px;
  padding:4px 14px;
  font-size:0.875rem;
  line-height:1.8;
  color:var(--ink);
}
.chip:hover{border-color:var(--ac)}
.chip.on{
  background:var(--gold);
  border-color:var(--gold);
  color:var(--gt);
  font-weight:700;
}
.chip.on i{
  color:var(--gt);
}
.chip i{
  font-style:normal;
  color:var(--mu);
  font-size:0.85rem;
  margin-left:5px;
}
.back{
  border:0;
  background:var(--tint);
  color:var(--ac);
  font-size:0.875rem;
  font-weight:600;
  padding:4px 16px;
  border-radius:999px;
  margin-bottom:12px;
  line-height:2;
}
.back:hover{background:var(--ac);color:var(--act)}

.box{
  background:var(--sf);
  border:1px solid var(--ln);
  border-radius:16px;
  padding:14px 16px;
  margin:12px 0;
  box-shadow:var(--sh);
}
.box h3{
  margin:0 0 8px;
  font-size:0.875rem;
  color:var(--gold);
  font-weight:700;
  display:flex;
  align-items:center;
}
.box h3::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--gold);
  margin-right:8px;
  flex:none;
  box-shadow:0 0 6px var(--gold);
}

.nm{
  font-size:1.375rem;
  font-weight:700;
  margin:4px 0 2px;
  line-height:1.6;
}
.sub{color:var(--mu);font-size:0.875rem;line-height: 1.7;}
.note{font-size:0.8125rem;color:var(--mu);margin-top:6px;line-height:1.7}

.fm{
  display:block;
  width:100%;
  border:1px solid var(--ln);
  background:var(--bg);
  color:var(--ink);
  border-radius:12px;
  padding:8px 12px;
  font:inherit;
  margin:6px 0;
  outline:none;
  transition:border-color .15s;
}
.fm:focus{border-color:var(--ac)}
textarea.fm{min-height:120px;resize:vertical;line-height:1.7}

.th{
  display:block;
  width:100%;
  border:0;
  padding:0;
  background:none;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:8px;
}
.th img{display:block;width:100%;max-height:320px;object-fit:cover}
.lk{display:block;color:var(--ac);font-weight:600;text-decoration:none;word-break:break-all}
.lk small{display:block;color:var(--mu);font-weight:400;font-size:0.8125rem}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.bdg{
  display:inline-block;
  margin-left:8px;
  padding:0 9px;
  border-radius:999px;
  background:var(--gold);
  color:var(--gt);
  font-size:0.8125rem;
  font-weight:700;
  line-height:1.7;
  vertical-align:middle;
}
.ce-group-title {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  margin-bottom: 6px;
  padding: 3px 10px;
  font-size: 0.88rem;
  font-weight: 700;
  color: #ffd54f;
  background: rgba(255, 213, 79, 0.12);
  border-left: 3px solid #ffc107;
  border-radius: 0 6px 6px 0;
  letter-spacing: 0.2px;
}
.ce-group {
  margin-top: 10px;
  padding: 8px 10px 10px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.ce-group-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.9rem;
  font-weight: 700;
  color: #90caf9;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px dashed rgba(144, 202, 249, 0.25);
}

.ce-group-count {
  font-size: 0.78rem;
  font-weight: 600;
  color: #e0e0e0;
  background: rgba(144, 202, 249, 0.16);
  padding: 1px 8px;
  border-radius: 999px;
}
</style>
</head>
<body>
<header>
  <h1>🪷 အဘိဓမ္မာ လေ့ကျင့်ခန်း</h1>
  <p>စိတ် · စေတသိက် · ရုပ် · ဝီထိ · မေးခွန်း . အဓိပ္ပါယ် .  ကျက်ရန် · ကိုယ်ပိုင်</p>
</header>
<div id="app"></div>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = n => Math.floor(Math.random() * n);
const shf = a => a.slice().sort(() => Math.random() - .5);
const uq = a => [...new Set(a)];
const bm = n => String(n).replace(/\d/g, d => "၀၁၂၃၄၅၆၇၈၉"[d]);

// ================= စိတ် ဒေတာ =================
const O = ["ပထမ", "ဒုတိယ", "တတိယ", "စတုတ္ထ", "ပဉ္စမ", "ဆဋ္ဌ", "သတ္တမ", "အဋ္ဌမ"];
const C7 = ["ဖဿ", "ဝေဒနာ", "သညာ", "စေတနာ", "ဧကဂ္ဂတာ", "ဇီဝိတိန္ဒြေ", "မနသိကာရ"];
const PN = ["ဝိတက်", "ဝိစာရ", "အဓိမောက္ခ", "ဝီရိယ", "ပီတိ", "ဆန္ဒ"];
const MOHA = ["မောဟ", "အဟိရိက", "အနောတ္တပ္ပ", "ဥဒ္ဓစ္စ"];
const SOB = ["သဒ္ဓါ", "သတိ", "ဟိရိ", "ဩတ္တပ္ပ", "အလောဘ", "အဒေါသ", "တတြမဇ္ဈတ္တတာ", "ကာယပဿဒ္ဓိ", "စိတ္တပဿဒ္ဓိ", "ကာယလဟုတာ", "စိတ္တလဟုတာ", "ကာယမုဒုတာ", "စိတ္တမုဒုတာ", "ကာယကမ္မညတာ", "စိတ္တကမ္မညတာ", "ကာယပါဂုညတာ", "စိတ္တပါဂုညတာ", "ကာယုဇုကတာ", "စိတ္တုဇုကတာ"];
const VIR = ["သမ္မာဝါစာ*", "သမ္မာကမ္မန္တ*", "သမ္မာအာဇီဝ*"];
const APP = ["ကရုဏာ*", "မုဒိတာ*"];
const D6 = ["စက္ခုဒွါရ", "သောတဒွါရ", "ဃာနဒွါရ", "ဇိဝှါဒွါရ", "ကာယဒွါရ", "မနောဒွါရ"];
const A6 = ["ရူပါရုံ", "သဒ္ဒါရုံ", "ဂန္ဓာရုံ", "ရသာရုံ", "ဖောဋ္ဌဗ္ဗာရုံ", "ဓမ္မာရုံ"];
const S5 = D6.slice(0, 5), A5 = A6.slice(0, 5), VM = "ဒွါရဝိမုတ်";
const pk = f => PN.filter((_, i) => f[i] == "1");
const base = f => [["သဗ္ဗစိတ္တသာဓာရဏ", C7], ["ပကိဏ္ဏက", pk(f)]];
const T = [];
const add = o => { o.ce = o.ce.filter(g => Array.isArray(g[1]) && g[1].length > 0); T.push(o); };
const NOLOK = "လောကုတ္တရာမှ လွဲ၍ အာရုံ ၆ ပါး", ALL = "အာရုံ ၆ ပါးလုံး", KAMA = "ကာမာရုံ ၆ ပါး";
const TM = [["ထိနမိဒ္ဓ", ["ထိန*", "မိဒ္ဓ*"]]];
const PS = ["ပညိန္ဒြေ"];

for (let i = 0; i < 8; i++) {
  const so = i < 4, di = [0, 1, 4, 5].includes(i), sa = i % 2;
  add({
    g: "လောဘမူ ၈",
    n: `လောဘမူ ${O[i]}စိတ်`,
    s: `${so ? "သောမနဿ" : "ဥပေက္ခာ"}၊ ဒိဋ္ဌိဂတ${di ? "သမ္ပယုတ်" : "ဝိပ္ပယုတ်"}၊ ${sa ? "သသင်္ခါရိက" : "အသင်္ခါရိက"}`,
    pl: "ကာမ", j: "အကုသိုလ်", ve: so ? "သောမနဿ" : "ဥပေက္ခာ", hetu: ["လောဘ", "မောဟ"],
    ce: [...base(so ? "111111" : "111101"), ["မောဟစတုက်", MOHA], ["လောဘ", di ? ["လောဘ", "ဒိဋ္ဌိ"] : ["လောဘ", "မာန*"]], ...(sa ? TM : [])],
    dv: D6, kc: ["ဇော"], ar: A6, an: NOLOK, jv: 1
  });
}
for (let i = 0; i < 2; i++) {
  add({
    g: "ဒေါသမူ ၂",
    n: `ဒေါသမူ ${O[i]}စိတ်`,
    s: `ဒေါမနဿ၊ ပဋိဃသမ္ပယုတ်၊ ${i ? "သသင်္ခါရိက" : "အသင်္ခါရိက"}`,
    pl: "ကာမ", j: "အကုသိုလ်", ve: "ဒေါမနဿ", hetu: ["ဒေါသ", "မောဟ"],
    ce: [...base("111101"), ["မောဟစတုက်", MOHA], ["ဒေါသစတုက်", ["ဒေါသ", "ဣဿာ*", "မစ္ဆရိယ*", "ကုက္ကုစ္စ*"]], ...(i ? TM : [])],
    dv: D6, kc: ["ဇော"], ar: A6, an: NOLOK, jv: 1
  });
}
add({ g: "မောဟမူ ၂", n: "မောဟမူ ပထမစိတ်", s: "ဥပေက္ခာ၊ ဝိစိကိစ္ဆာသမ္ပယုတ်", pl: "ကာမ", j: "အကုသိုလ်", ve: "ဥပေက္ခာ", hetu: ["မောဟ"], ce: [...base("110100"), ["မောဟစတုက်", MOHA], ["ဝိစိကိစ္ဆာ", ["ဝိစိကိစ္ဆာ"]]], dv: D6, kc: ["ဇော"], ar: A6, an: NOLOK, jv: 1 });
add({ g: "မောဟမူ ၂", n: "မောဟမူ ဒုတိယစိတ်", s: "ဥပေက္ခာ၊ ဥဒ္ဓစ္စသမ္ပယုတ်", pl: "ကာမ", j: "အကုသိုလ်", ve: "ဥပေက္ခာ", hetu: ["မောဟ"], ce: [...base("111100"), ["မောဟစတုက်", MOHA]], dv: D6, kc: ["ဇော"], ar: A6, an: NOLOK, jv: 1 });

const V5 = ["စက္ခု", "သောတ", "ဃာန", "ဇိဝှါ", "ကာယ"], K5 = ["ဒဿန", "သဝန", "ဃာယန", "သာယန", "ဖုသန"];
for (const [g, j, sv] of [["အကုသိုလ်ဝိပါက် ၇", "အကုသိုလ်", "ဒုက္ခ"], ["အဟေတုက ကုသိုလ်ဝိပါက် ၈", "ကုသိုလ်", "သုခ"]]) {
  for (let k = 0; k < 5; k++) {
    const ve = k == 4 ? sv : "ဥပေက္ခာ";
    add({ g, n: `${V5[k]}ဝိညာဏ် (${j}ဝိပါက်)`, s: ve, pl: "ကာမ", j: "ဝိပါက်", ve, hetu: [], ce: base("000000"), dv: [D6[k]], kc: [K5[k]], ar: [A6[k]], an: `${A6[k]} တစ်မျိုးသာ`, jv: 0 });
  }
}
const AH = (g, j, n, ve, f, dv, kc, ar, an, jv) => add({ g, n, s: ve, pl: "ကာမ", j, ve, hetu: [], ce: base(f), dv, kc, ar, an, jv });
AH("အကုသိုလ်ဝိပါက် ၇", "ဝိပါက်", "သမ္ပဋိစ္ဆိန် (အကုသိုလ်ဝိပါက်)", "ဥပေက္ခာ", "111000", S5, ["သမ္ပဋိစ္ဆိန်"], A5, "ပဉ္စာရုံ ၅ ပါး", 0);
AH("အကုသိုလ်ဝိပါက် ၇", "ဝိပါက်", "သန္တီရဏ (အကုသိုလ်ဝိပါက်)", "ဥပေက္ခာ", "111000", [...S5, D6[5], VM], ["ပဋိသန္ဓေ", "ဘဝင်", "စုတိ", "သန္တီရဏ", "တဒါရုံ"], A6, KAMA, 0);
AH("အဟေတုက ကုသိုလ်ဝိပါက် ၈", "ဝိပါက်", "သမ္ပဋိစ္ဆိန် (ကုသိုလ်ဝိပါက်)", "ဥပေက္ခာ", "111000", S5, ["သမ္ပဋိစ္ဆိန်"], A5, "ပဉ္စာရုံ ၅ ပါး", 0);
AH("အဟေတုက ကုသိုလ်ဝိပါက် ၈", "ဝိပါက်", "သန္တီရဏ (သောမနဿ)", "သောမနဿ", "111010", [...S5, D6[5]], ["သန္တီရဏ", "တဒါရုံ"], A6, KAMA, 0);
AH("အဟေတုက ကုသိုလ်ဝိပါက် ၈", "ဝိပါက်", "သန္တီရဏ (ဥပေက္ခာ)", "ဥပေက္ခာ", "111000", [...S5, D6[5], VM], ["ပဋိသန္ဓေ", "ဘဝင်", "စုတိ", "သန္တီရဏ", "တဒါရုံ"], A6, KAMA, 0);
AH("အဟေတုက ကြိယာ ၃", "ကြိယာ", "ပဉ္စဒွါရာဝဇ္ဇန်း", "ဥပေက္ခာ", "111000", S5, ["အာဝဇ္ဇန်း"], A5, "ပဉ္စာရုံ ၅ ပါး", 0);
AH("အဟေတုက ကြိယာ ၃", "ကြိယာ", "မနောဒွါရာဝဇ္ဇန်း", "ဥပေက္ခာ", "111100", [D6[5]], ["အာဝဇ္ဇန်း", "ဝုဋ္ဌော"], A6, ALL, 0);

const readImg = f => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onerror = rej;
  fr.onload = () => {
    const im = new Image();
    im.onerror = rej;
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = Math.round(im.width * k);
      c.height = Math.round(im.height * k);
      const x = c.getContext("2d");
      x.fillStyle = "#fff";
      x.fillRect(0, 0, c.width, c.height);
      x.drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", .85));
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
});

    `<div class="chips" style="margin-top:8px"><button class="chip on" data-ml="1">Link သိမ်းမည်</button><button class="chip on" data-mi="1">ပုံ / ဇယား ရွေးမည်</button></div>` +
    `<input type="file" id="mfile" accept="image/*" hidden>` +
    `<div class="note">ပုံနှင့် link များကို ဤဖုန်း၏ browser ထဲတွင်သာ သိမ်းသည်။ browser data ဖျက်လျှင် ပျောက်နိုင်သည်။${DBX ? "" : " (လက်ရှိ သိမ်းဆည်း၍ မရသဖြင့် ဤအကြိမ်သာ ကျန်မည်)"}</div></details>` +
    `<div class="chips" style="margin:8px 0 12px">${["အားလုံး", ...MC].map(c => `<button class="chip ${MF == c ? "on" : ""}" data-mc="${c}">${c}</button>`).join("")}</div>`;
  if (!L.length) h += `<div class="note">ထည့်ထားတာ မရှိသေးပါ။</div>`;
  h += L.map(x => {
    const del = `<button class="chip" data-md="${x.id}">${MD == String(x.id) ? "ဧကန် ဖျက်မည်" : "ဖျက်မည်"}</button>`;
    return x.type == "img"
      ? `<div class="box"><button class="th" data-mv="${x.id}"><img src="${x.data}" alt="${esc(x.title)}"></button><b>${esc(x.title)}</b><div class="row2"><span class="sub">${x.cat}</span>${del}</div></div>`
      : `<div class="box"><a class="lk" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">▶ ${esc(x.title)}<small>${esc(x.host)}</small></a><div class="row2"><span class="sub">${x.cat}</span>${del}</div></div>`;
  }).join("");
  return h;
}
function mineView(id) {
  const x = MI.find(y => String(y.id) == String(id));
  if (!x) return "";
  return `<button class="back" data-b>‹ နောက်သို့</button><div class="nm">${esc(x.title)}</div><div class="sub">${x.cat}</div>` +
    `<div class="chips" style="margin:8px 0"><button class="chip on" data-mz="1">ချဲ့/ချုံ့ ×${MZ}</button></div>` +
    `<div style="overflow:auto;border-radius:12px;border:1px solid var(--ln)"><img src="${x.data}" alt="${esc(x.title)}" style="display:block;width:${MZ * 100}%;max-width:none"></div>`;
}

// ================= Render & Event Handling =================
let FSize = parseInt(localStorage.getItem("abhi-fs") || "16", 10) || 16;
document.documentElement.style.fontSize = FSize + "px";

const sysBar = () => `
  <div class="chips" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
    <div class="note" style="margin:0">စိတ် (ကျဉ်း) ၈၉-ပါး (ကျယ်) ၁၂၁-ပါး</div>
    <div>
      <button class="chip" data-fs="-">A-</button>
      <button class="chip" data-fs="+">A+</button>
    </div>
  </div>`;

let tab = "list", fa = "ဝေဒနာ", st = [];

function render() {
  const s = st[st.length - 1];
  let h = "";
  if (!s) {
    h = sysBar() + `<div class="seg">` +
      `<button data-t="list" aria-pressed="${tab == "list"}">စိတ်စာရင်း</button>` +
      `<button data-t="flt" aria-pressed="${tab == "flt"}">အချက်ဖြင့် ရှာရန်</button>` +
      `<button data-t="vithi" aria-pressed="${tab == "vithi"}">ဝီထိ</button>` +
      `<button data-t="rupa" aria-pressed="${tab == "rupa"}">ရုပ် ၂၈</button>` +
      `<button data-t="gl" aria-pressed="${tab == "gl"}">အဓိပ္ပါယ်</button>` +
      `<button data-t="study" aria-pressed="${tab == "study"}">ကျက်ရန်</button>` +
      `<button data-t="exam" aria-pressed="${tab == "exam"}">မေးခွန်း</button>` +
      `<button data-t="mine" aria-pressed="${tab == "mine"}">ကိုယ်ပိုင်</button>` +
      `</div>`;
    if (tab == "gl") h += glHome();
    else if (tab == "mine") h += mineHome();
    else if (tab == "study") h += studyHome();
    else if (tab == "exam") h += examHome();
    else if (tab == "vithi") h += vithiHome();
    else if (tab == "rupa") h += rupaHome();
    else if (tab == "list") {
      const seen = [];
      T.forEach(c => { if (!seen.includes(c.g)) seen.push(c.g); });
      h += seen.map(g => `<details><summary>${g}</summary>${T.map((c, i) => c.g == g ? itm(i) : "").join("")}</details>`).join("");
    } else {
      h += `<div class="chips">${AT.map(a => `<button class="chip ${a == fa ? "on" : ""}" data-a="${a}">${a}</button>`).join("")}</div><div class="box" style="margin-top:10px"><div class="chips">`;
      const m = {};
      T.forEach(c => attr(c, fa).forEach(v => m[v] = (m[v] || 0) + 1));
      h += Object.keys(m).map(v => `<button class="chip" data-f="${fa}" data-v="${v}">${v}<i>${m[v]}</i></button>`).join("") + `</div></div>`;
    }
  } else if (s.g !== undefined) {
    h = glView(s.g);
  } else if (s.mv !== undefined) {
    h = mineView(s.mv);
  } else if (s.r !== undefined) {
    h = rupaDetail(s.r);
  } else if (s.rf) {
    h = rupaList(s.rf, s.v);
  } else if (s.f) {
    const L = T.map((c, i) => i).filter(i => attr(T[i], s.f).includes(s.v));
    h = `<button class="back" data-b>‹ နောက်သို့</button><div class="nm">${s.f} - ${s.v}</div>${glBox(s.v)}<div class="sub">စိတ် ${L.length} ပါး</div>` + L.map(itm).join("");
  } else {
    const c = T[s.i];
    const row = (l, t) => `<div class="box"><h3>${t || l}</h3><div class="chips">${attr(c, l).map(v => chip(l, v)).join("")}</div></div>`;
    h = `<button class="back" data-b>‹ နောက်သို့</button><div class="nm">${c.n}</div><div class="sub">${c.s}</div>` +
      `<div class="chips" style="margin-top:8px">${chip("ဘူမိ", c.pl)}${chip("ဇာတိ", c.j)}${chip("ဇော", c.jv ? "ဇောစိတ်" : "ဇောမဟုတ်")}</div>` +
      jhBox(c) + row("ဝေဒနာ") + row("ဟေတု", "ဟေတု " + c.hetu.length + " ပါး") + row("ဒွါရ") + row("ဝတ္ထု") + vNote(c) + row("ကိစ္စ") +
      `<div class="box"><h3>အာရုံ</h3><div class="chips">${c.ar.map(v => chip("အာရုံ", v)).join("")}</div><div class="note">${c.an}</div></div>` +
      `<div class="box"><h3>ယှဉ်သော စေတသိက် ${toMmNum(cnt(c))} ပါး</h3>` +
  c.ce.map(g => `<div class="ce-group"><div class="ce-group-title"><span>${g[0]}</span><span class="ce-group-count">${toMmNum(g[1].length)} ပါး</span></div><div class="chips">${g[1].map(v => chip("စေတသိက်", v.replace("*", "")).replace(">" + v.replace("*", "") + "<", ">" + v + "<")).join("")}</div></div>`).join("") +
  (JSON.stringify(c.ce).includes("*") ? `<div class="note" style="margin-top:8px">* ပါသော စေတသိက်သည် တစ်ခါတစ်ရံသာ ယှဉ်သော်လည်း အရေအတွက်ထဲ ပါဝင်သည်။</div>` : "") +
`</div>`;

  }
  $("app").innerHTML = h;
  scrollTo(0, 0);
}

$("app").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.t) { tab = b.dataset.t; render(); }
  else if (b.dataset.et) { EXAM.topic = b.dataset.et; EXAM.pool = []; EXAM.pos = 0; EXAM.show = false; render(); }
  else if (b.dataset.estart) { examStart(false); render(); }
  else if (b.dataset.ereview) { examStart(true); render(); }
  else if (b.dataset.eopt !== undefined) {
    if (!EXAM.show && EXAM.pool[EXAM.pos]) {
      const q = EXAM.pool[EXAM.pos], chosen = decodeURIComponent(b.dataset.eopt);
      EXAM.chosen = chosen; EXAM.show = true; EXAM.answered++;
      EXAM_WRONG = EXAM_WRONG.filter(x => !(x.t === q.t && x.q === q.q));
      if (chosen === q.a) EXAM.score++;
      else EXAM_WRONG.push(q);
      examSaveWrong();
      render();
    }
  }
  else if (b.dataset.enext) { EXAM.pos++; EXAM.show = false; EXAM.chosen = null; render(); }
  else if (b.dataset.a) { fa = b.dataset.a; render(); }
  else if (b.dataset.i !== undefined) { st.push({ i: +b.dataset.i }); render(); }
  else if (b.dataset.gi !== undefined) { st.push({ g: +b.dataset.gi }); render(); }
  else if (b.dataset.bk) {
    const k = b.dataset.bk;
    if (k == "exp") bkSave();
    else if (k == "share") bkShare();
    else $("bkfile").click();
  }
  else if (b.dataset.mc) { MF = b.dataset.mc; render(); }
  else if (b.dataset.mi !== undefined) { $("mfile").click(); }
  else if (b.dataset.ml !== undefined) { mSaveLink(); }
  else if (b.dataset.md) {
    if (MD == b.dataset.md) { mDel(b.dataset.md); MD = null; }
    else MD = b.dataset.md;
    render();
  }
  else if (b.dataset.mv) { st.push({ mv: b.dataset.mv }); render(); }
  else if (b.dataset.mz !== undefined) { MZ = MZ % 3 + 1; render(); }
  else if (b.dataset.rs) {
    Object.keys(PG).filter(k => k.startsWith(ST.d + "|")).forEach(k => delete PG[k]);
    pSave(); render();
  }
  else if (b.dataset.sd) { ST.d = b.dataset.sd; ST.q = null; ST.f = 0; ST.s = 0; ST.t = 0; render(); }
  else if (b.dataset.sm) { ST.m = b.dataset.sm; ST.q = null; ST.f = 0; render(); }
  else if (b.dataset.sf) { ST.f = 1; render(); }
  else if (b.dataset.sn) {
    if (b.dataset.sn != "x" && ST.q) rec(ST.q, b.dataset.sn == "1");
    if (b.dataset.sn == "1") ST.s++;
    if (b.dataset.sn != "x") ST.t++;
    ST.q = null; ST.f = 0; render();
  }
  else if (b.dataset.so !== undefined) {
    const q = ST.q;
    if (q && q.g === undefined) {
      q.g = +b.dataset.so; ST.t++;
      rec(q, q.o[q.g] == q.a);
      if (q.o[q.g] == q.a) ST.s++;
      render();
    }
  }
  else if (b.dataset.ri !== undefined) { st.push({ r: +b.dataset.ri }); render(); }
  else if (b.dataset.rf) { st.push({ rf: b.dataset.rf, v: b.dataset.v }); render(); }
  else if (b.dataset.f) { st.push({ f: b.dataset.f, v: b.dataset.v }); render(); }
  else if (b.dataset.b !== undefined) { st.pop(); render(); }
  else if (b.dataset.fs) {
    if (b.dataset.fs == "+" && FSize < 36) FSize += 2;
    if (b.dataset.fs == "-" && FSize > 12) FSize -= 2;
    document.documentElement.style.fontSize = FSize + "px";
    try { localStorage.setItem("abhi-fs", FSize); } catch (e) {}
    render();
  }
};

$("app").oninput = e => {
  if (e.target.id == "gnote" && GCUR != null) {
    GN[GCUR] = e.target.value;
    try { localStorage.setItem("abhi-gl-note", JSON.stringify(GN)); } catch (x) {}
  }
};

$("app").onchange = async e => {
  const t = e.target;
  if (t.id == "bkfile") { await bkImport(t.files[0]); t.value = ""; return; }
  if (t.id != "mfile" || !t.files[0]) return;
  const f = t.files[0];
  try {
    const d = await readImg(f);
    mPut({ id: Date.now(), t: Date.now(), type: "img", cat: $("mcat").value, title: ($("mti").value || "").trim() || f.name.replace(/\.[^.]+$/, ""), data: d });
    MM = "သိမ်းပြီးပါပြီ";
  } catch (err) {
    MM = "ပုံကို ဖတ်၍ မရပါ";
  }
  render();
};

render();
mLoad();
</script>
</body>
</html>
